name: Add explore card images and restore logo
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-explore-card-images.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: add-explore-card-images
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download and optimise two real photographs
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow beautifulsoup4
          mkdir -p /tmp/guidephotos assets/photos
          curl -fL --retry 3 --connect-timeout 10 --max-time 45 -A 'Mozilla/5.0 BrennvikaGuide/1.0' 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Lakseoppdrett.jpg?width=800' -o /tmp/guidephotos/salmon.jpg
          curl -fL --retry 3 --connect-timeout 10 --max-time 45 -A 'Mozilla/5.0 BrennvikaGuide/1.0' 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Interior%20from%20Sulitjelma%20Coop%20shop.jpg?width=800' -o /tmp/guidephotos/grocery.jpg
          python - <<'PY'
          from PIL import Image, ImageOps
          for src,dst in [('salmon.jpg','salmon-farm.webp'),('grocery.jpg','grocery-store.webp')]:
              im=Image.open('/tmp/guidephotos/'+src)
              im=ImageOps.exif_transpose(im).convert('RGB')
              im.thumbnail((800,600),Image.Resampling.LANCZOS)
              im.save('assets/photos/'+dst,'WEBP',quality=76,method=6)
          PY
      - name: Build current guide and apply visual polish
        run: |
          set -euo pipefail
          python tools/build_guide.py
          python tools/add_visual_cards.py
          node --check guide-v3.js
      - name: Validate logo, cards and performance rules
        run: |
          python - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path
          for name in ['index.html','no.html','de.html']:
              soup=BeautifulSoup(Path(name).read_text(),'html.parser')
              assert soup.select_one('.brand-logo[src="assets/logo.webp"]'), name
              cards=soup.select('.other-ideas > details.visual-place')
              assert len(cards)>=6,(name,len(cards))
              for card in cards[:6]:
                  img=card.select_one('summary .place-summary-media img')
                  assert img and Path(img['src']).is_file(),(name,img)
                  assert img.get('loading')=='lazy'
              remote=[i.get('src') for i in soup.find_all('img') if i.get('src','').startswith(('http://','https://'))]
              assert not remote,(name,remote)
              print(name,'OK',len(cards),'visual cards')
          PY
      - name: Commit and publish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add-explore-card-images.yml
          git add index.html no.html de.html guide-v3.css tools/add_visual_cards.py assets/photos/salmon-farm.webp assets/photos/grocery-store.webp
          git commit -m 'Restore Skoglund Heim logo and add images to explore cards'
          git push origin HEAD:main
      - name: Request Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
