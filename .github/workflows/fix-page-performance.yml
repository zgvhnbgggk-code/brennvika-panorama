name: Fix guest guide performance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-page-performance.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: fix-guest-guide-performance
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download and optimise external guide photographs
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow beautifulsoup4
          mkdir -p /tmp/guidephotos assets/photos
          curl -fL --retry 3 --connect-timeout 10 --max-time 45 -A 'Mozilla/5.0 BrennvikaGuide/1.0' 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/63/Northern_lights_curtains_and_beams_over_Nordmo_in_Bjerkvik%2C_Narvik%2C_Nordland%2C_Norway%2C_2023_September_-_3.jpg/960px-Northern_lights_curtains_and_beams_over_Nordmo_in_Bjerkvik%2C_Narvik%2C_Nordland%2C_Norway%2C_2023_September_-_3.jpg' -o /tmp/guidephotos/aurora.jpg
          curl -fL --retry 3 --connect-timeout 10 --max-time 45 -A 'Mozilla/5.0 BrennvikaGuide/1.0' 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Hamaroy_fyr%2C_Norge_%281%29.jpg?width=1000' -o /tmp/guidephotos/tranoy.jpg
          curl -fL --retry 3 --connect-timeout 10 --max-time 45 -A 'Mozilla/5.0 BrennvikaGuide/1.0' 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Hamar%C3%B8yskaftet01.JPG?width=1000' -o /tmp/guidephotos/hamaroyskaftet.jpg
          curl -fL --retry 3 --connect-timeout 10 --max-time 45 -A 'Mozilla/5.0 BrennvikaGuide/1.0' 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Hamsunsenteret.jpg?width=1000' -o /tmp/guidephotos/hamsun.jpg
          curl -fL --retry 3 --connect-timeout 10 --max-time 45 -A 'Mozilla/5.0 BrennvikaGuide/1.0' 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Hellemobotn.jpg?width=1000' -o /tmp/guidephotos/hellmobotn.jpg
          curl -fL --retry 3 --connect-timeout 10 --max-time 45 -A 'Mozilla/5.0 BrennvikaGuide/1.0' 'https://ems.dimu.org/image/012uN1buK4ge?dimension=800x800' -o /tmp/guidephotos/tranoy-art.jpg
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          mapping={
            'aurora.jpg':'aurora.webp',
            'tranoy.jpg':'tranoy-lighthouse.webp',
            'hamaroyskaftet.jpg':'hamaroyskaftet.webp',
            'hamsun.jpg':'hamsun-centre.webp',
            'hellmobotn.jpg':'hellmobotn.webp',
            'tranoy-art.jpg':'tranoy-art.webp',
          }
          for src,dst in mapping.items():
              im=Image.open('/tmp/guidephotos/'+src)
              im=ImageOps.exif_transpose(im).convert('RGB')
              im.thumbnail((1100,900),Image.Resampling.LANCZOS)
              im.save('assets/photos/'+dst,'WEBP',quality=78,method=6)
              print(dst,Path('assets/photos/'+dst).stat().st_size,im.size)
          PY
      - name: Remove remote image dependencies and trim rendering work
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/build_guide.py')
          s=p.read_text()
          s=s.replace("AURORA='https://upload.wikimedia.org/wikipedia/commons/thumb/6/63/Northern_lights_curtains_and_beams_over_Nordmo_in_Bjerkvik%2C_Narvik%2C_Nordland%2C_Norway%2C_2023_September_-_3.jpg/960px-Northern_lights_curtains_and_beams_over_Nordmo_in_Bjerkvik%2C_Narvik%2C_Nordland%2C_Norway%2C_2023_September_-_3.jpg'", "AURORA='assets/photos/aurora.webp'")
          s=s.replace("ART='https://ems.dimu.org/image/012uN1buK4ge?dimension=800x800'", "ART='assets/photos/tranoy-art.webp'")
          s=s.replace("tranoyimg=oldcards[0].img['src']", "tranoyimg='assets/photos/tranoy-lighthouse.webp'")
          needle="for a in oldcards[1:]:\n  for img in a.select('img'): img['width']='960';img['height']='540';img['decoding']='async';img['loading']='lazy'\n morecards=''.join(map(str,oldcards[1:]))"
          repl="local_more=['assets/photos/hamaroyskaftet.webp','assets/photos/hamsun-centre.webp','assets/photos/hellmobotn.webp']\n for a,local_src in zip(oldcards[1:],local_more):\n  for img in a.select('img'):\n   img['src']=local_src;img['width']='960';img['height']='540';img['decoding']='async';img['loading']='lazy';img['fetchpriority']='low'\n morecards=''.join(map(str,oldcards[1:]))"
          if needle not in s: raise SystemExit('Expected feature-card block not found')
          s=s.replace(needle,repl)
          s=s.replace("return f'<img class=\"{cls}\" src=\"{E(src,quote=True)}\" alt=\"{E(alt,quote=True)}\" width=\"{w}\" height=\"{h}\" loading=\"{\"eager\" if eager else \"lazy\"}\" decoding=\"async\"'+(' fetchpriority=\"high\"' if eager else '')+'>'", "return f'<img class=\"{cls}\" src=\"{E(src,quote=True)}\" alt=\"{E(alt,quote=True)}\" width=\"{w}\" height=\"{h}\" loading=\"{\"eager\" if eager else \"lazy\"}\" decoding=\"async\"'+(' fetchpriority=\"high\"' if eager else ' fetchpriority=\"low\"')+'>'")
          p.write_text(s)
          css=Path('guide-v3.css')
          c=css.read_text()
          perf='''\n/* Performance: defer layout and paint for content far below the viewport. */\n@supports (content-visibility:auto){\n  .more-experiences,.day-story,.practical-intro~.section,.closing-section,.footer{content-visibility:auto;contain-intrinsic-size:auto 760px}\n}\n'''
          if 'Performance: defer layout' not in c: css.write_text(c+perf)
          Path('.nojekyll').touch()
          PY
      - name: Rebuild and validate zero remote image requests
        run: |
          set -euo pipefail
          python tools/build_guide.py
          node --check guide-v3.js
          python - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path
          import os
          for name in ['index.html','no.html','de.html']:
              soup=BeautifulSoup(Path(name).read_text(),'html.parser')
              remote=[i.get('src') for i in soup.find_all('img') if i.get('src','').startswith(('http://','https://'))]
              assert not remote,(name,remote)
              for img in soup.find_all('img'):
                  src=img.get('src','')
                  if src and not src.startswith('data:'): assert Path(src).is_file(),(name,src)
              scripts=[s.get('src') for s in soup.find_all('script')]
              assert scripts==['guide-v3.js'],scripts
              assert 'MutationObserver' not in Path('guide-v3.js').read_text()
              print(name,'html_bytes=',Path(name).stat().st_size,'images=',len(soup.find_all('img')))
          critical=sum(Path(x).stat().st_size for x in ['index.html','guide-v3.css','guide-v3.js','assets/photos/coast-summer.avif'])
          print('critical_payload_uncompressed_bytes=',critical)
          assert critical < 100000,critical
          PY
      - name: Commit performance fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-page-performance.yml
          git add tools/build_guide.py guide-v3.css index.html no.html de.html .nojekyll assets/photos/aurora.webp assets/photos/tranoy-lighthouse.webp assets/photos/hamaroyskaftet.webp assets/photos/hamsun-centre.webp assets/photos/hellmobotn.webp assets/photos/tranoy-art.webp
          git commit -m 'Eliminate remote image bottleneck and speed up guest guide'
          git push origin HEAD:main
      - name: Request Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
