name: Fix Hamarøyskaftet guided photo quality
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-hamaroyskaftet-photo-v2.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: fix-hamaroyskaftet-photo-v2
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore the proper photograph
        run: |
          set -euo pipefail
          cat .hamaroy-photo/01.b64 .hamaroy-photo/02.b64 .hamaroy-photo/03.b64 .hamaroy-photo/04.b64 .hamaroy-photo/05.b64 .hamaroy-photo/06.b64 \
            | tr -d '\n\r ' \
            | base64 -d > assets/photos/hamaroyskaftet-guided-ascent-v2.avif
          echo '8297e9757d761d74fc4faa290794ce5e8c7bdcac4edd0cd935e62bfc1db7ef48  assets/photos/hamaroyskaftet-guided-ascent-v2.avif' | sha256sum -c -
          test "$(stat -c%s assets/photos/hamaroyskaftet-guided-ascent-v2.avif)" -eq 22710
          file assets/photos/hamaroyskaftet-guided-ascent-v2.avif

      - name: Improve gallery layout and publish it
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check beautifulsoup4==4.14.3
          python - <<'PY'
          from pathlib import Path

          p = Path('tools/add_hamaroyskaftet_photo.py')
          s = p.read_text()
          s = s.replace(
              'PHOTO = "assets/photos/hamaroyskaftet-guided-ascent.webp"',
              'PHOTO = "assets/photos/hamaroyskaftet-guided-ascent-v2.avif"'
          )
          s = s.replace('img["width"] = "640"', 'img["width"] = "420"')
          s = s.replace('img["height"] = "853"', 'img["height"] = "560"')
          s = s.replace('width="640",', 'width="420",')
          s = s.replace('height="853",', 'height="560",')

          start = s.index("CSS = r'''", s.index('COPY ='))
          end = s.index("'''\n\n\ndef lang_key", start) + 3
          css = """CSS = r'''\n\n/* BP Hamarøyskaftet gallery: real guided-ascent photo + existing mountain overview. */\n.hamaroy-gallery{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,.75fr);gap:2px;background:var(--line);overflow:hidden;align-items:stretch}\n.hamaroy-gallery .hamaroy-main,.hamaroy-gallery .hamaroy-ascent{min-width:0;min-height:0;margin:0;position:relative;overflow:hidden;background:#d9dedc}\n.feature-place .hamaroy-gallery .hamaroy-main img{display:block;width:100%;height:100%;min-height:100%;aspect-ratio:auto;object-fit:cover;object-position:center center}\n.feature-place .hamaroy-gallery .hamaroy-ascent img{display:block;width:100%;height:auto;aspect-ratio:3/4;object-fit:cover;object-position:center center}\n.hamaroy-gallery figcaption{position:absolute;left:0;right:0;bottom:0;padding:46px 12px 10px;background:linear-gradient(transparent,rgba(5,33,39,.80));color:#fff;font-size:10px;line-height:1.4}\n@media(max-width:720px){\n .hamaroy-gallery{grid-template-columns:1fr;gap:2px}\n .feature-place .hamaroy-gallery .hamaroy-main img{height:auto;min-height:0;aspect-ratio:16/9}\n .feature-place .hamaroy-gallery .hamaroy-ascent img{height:auto;aspect-ratio:3/4;object-fit:cover;object-position:center center}\n .hamaroy-gallery figcaption{font-size:11px;padding:48px 14px 12px}\n}\n'''"""
          p.write_text(s[:start] + css + s[end:])
          PY

          python tools/add_hamaroyskaftet_photo.py

          for page in index.html no.html de.html; do
            grep -q 'hamaroyskaftet-guided-ascent-v2.avif' "$page"
            ! grep -q 'hamaroyskaftet-guided-ascent.webp' "$page"
          done

      - name: Commit corrected photo
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .hamaroy-photo
          git rm -f assets/photos/hamaroyskaftet-guided-ascent.webp
          git rm .github/workflows/fix-hamaroyskaftet-photo-v2.yml
          git add assets/photos/hamaroyskaftet-guided-ascent-v2.avif tools/add_hamaroyskaftet_photo.py guide-v3.css index.html no.html de.html
          git commit -m 'Fix guided Hamarøyskaftet photo quality and framing'
          git push origin HEAD:main

      - name: Request Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
