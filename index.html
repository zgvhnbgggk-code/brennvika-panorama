<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f2e9">
<meta name="description" content="Guest guide for Brennvika Panorama, Hamarøy, Norway.">
<title>Brennvika Panorama · Guest guide</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="#welcome"><img src="assets/logo.webp" alt="Skoglund Heim AS"></a>
    <div class="header-actions">
      <div class="lang-switch" aria-label="Language">
        <button type="button" data-lang="en" class="active">EN</button>
        <button type="button" data-lang="no">NO</button>
        <button type="button" data-lang="de">DE</button>
      </div>
      <a class="chip primary" href="#help" id="needHelpTop">Need help?</a>
      <button class="chip menu-btn" id="menuBtn" aria-expanded="false" aria-controls="menuPanel">Menu</button>
    </div>
  </div>
  <div class="desktop-nav"><nav class="wrap nav-scroll" id="desktopNav" aria-label="Guest guide"></nav></div>
</header>
<div class="menu-panel" id="menuPanel"><nav id="menuNav"></nav></div>
<section class="hero" id="welcome">
  <div class="hero-art" aria-hidden="true"><span class="ridge ridge-a"></span><span class="ridge ridge-b"></span><span class="ridge ridge-c"></span></div>
  <div class="hero-inner"><div class="kicker" id="heroKicker"></div><h1 id="heroTitle"></h1><p id="heroLead"></p><div class="hero-meta" id="heroMeta"></div></div>
</section>
<div class="quick-strip"><div class="wrap"><div class="quick-grid" id="quickGrid"></div></div></div>
<main id="content"><section class="section"><div class="wrap"><div class="card wide"><h3>Loading guest guide…</h3></div></div></section></main>
<footer class="footer"><div class="wrap footer-grid"><div><img src="assets/logo.webp" alt="Skoglund Heim AS"><h3>Brennvika Panorama</h3><p id="footerAddress"></p><small id="footerMaintained"></small></div><div><h3 id="footerQuickTitle"></h3><p id="footerLinks"></p></div></div></footer>
<nav class="toc-mobile" id="mobileNav" aria-label="Quick navigation"></nav>
<a class="sticky-help" href="#help" id="stickyHelp">Need help?</a>
<script src="app.js"></script>
</body>
</html>
